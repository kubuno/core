[workspace]
resolver = "2"
# Dépôt kubuno/core : uniquement le core + les crates partagées (consommées par les
# repos modules via dépendances git taguées). Les modules vivent dans leurs propres repos.
members  = [
    "crates/kubuno-core",
    "crates/kubuno-storage",
    "crates/kubuno-mcp",
    "crates/kubuno-seccomp",
    "crates/kubuno-modauth",
]

[workspace.package]
version      = "0.1.6"
edition      = "2021"
authors      = ["Kubuno Contributors"]
license      = "AGPL-3.0"
repository   = "https://github.com/kubuno/core"
rust-version = "1.82"

[workspace.dependencies]
# Async
tokio       = { version = "1",    features = ["full"] }
# CRDT Yjs côté serveur (consolidation GC des snapshots collab)
yrs         = "0.23"
axum        = { version = "0.7",  features = ["macros", "ws", "multipart"] }
# HTTPS natif (terminaison TLS dans le core). default-features=false + ring pour
# rester aligné sur le provider crypto de sqlx (évite de tirer aws-lc-rs/C).
axum-server = { version = "0.7",  default-features = false, features = ["tls-rustls"] }
rustls      = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificate metadata (subject, SAN, validity) for the admin HTTPS panel. No
# cryptography of its own: rustls remains the sole TLS engine. (PEM parsing uses
# the existing `rustls-pemfile` dependency declared further down.)
x509-parser    = "0.18"
# ACME (Let's Encrypt) client for automatic certificates. ring only — NO
# aws-lc-rs (default features off) to keep the single ring provider the core
# already links; rcgen for the finalize key, hyper-rustls for the built-in
# client. Terminates over rustls, like everything else.
instant-acme   = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
tower       = { version = "0.5",  features = ["full"] }
tower-http  = { version = "0.6",  features = ["cors", "compression-gzip", "trace", "limit", "fs", "set-header", "timeout"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "tls-rustls", "bigdecimal"] }

# Sérialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Crypto
jsonwebtoken = "9"
argon2       = "0.5"
aes-gcm      = "0.10"
rand         = "0.8"
sha2         = "0.10"
hmac         = "0.12"
subtle       = "2"
hkdf         = "0.12"
base64       = "0.22"

# HTTP Client (pour proxy modules + CLI upload)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Config & Env
config  = "0.14"
dotenvy = "0.15"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging & Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"
tokio-util         = { version = "0.7", features = ["io"] }
kubuno-storage     = { path = "crates/kubuno-storage" }
kubuno-mcp         = { path = "crates/kubuno-mcp" }
kubuno-seccomp     = { path = "crates/kubuno-seccomp" }
kubuno-modauth     = { path = "crates/kubuno-modauth" }

# Erreurs
thiserror = "1"
anyhow    = "1"

# Regular expressions for the content detectors of `crate::rules::detect`.
# The crate is deliberately the automaton-based one rather than a backtracking
# engine: patterns are written by administrators and executed against content
# written by users, so linear-time matching has to be a property of the engine
# rather than of a review process. See `rules/detect/scan.rs`.
regex  = "1"

# Utils
uuid   = { version = "1", features = ["v4", "serde"] }
# CIDR matching for the trusted reverse-proxy list (client address resolution)
ipnet  = "2"
# `statvfs` only: the health checks need the free space of the data volume, and
# the standard library exposes no such API. Nothing here spawns a process — the
# seccomp filter still refuses `execve`/`execveat` (see kubuno-seccomp).
libc   = "0.2"
chrono = { version = "0.4", features = ["serde"] }
# The IANA time-zone database, compiled in. `chrono` alone converts to UTC and to
# the *system* zone and to nothing else, so stating an instant in the zone an
# operator chose (`instance.timezone`) needs the real table. Data, not a runtime:
# no file is read and nothing is spawned, which the seccomp filter requires.
chrono-tz = "0.10"
bytes   = "1"
futures = "0.3"
hex     = "0.4"
toml    = "0.8"
clap    = { version = "4", features = ["color", "wrap_help", "derive", "env"] }
url                 = "2"
urlencoding         = "2"
tokio-tungstenite   = { version = "0.24", features = ["native-tls"] }
async-stream        = "0.3"
totp-rs             = { version = "5", features = ["gen_secret", "otpauth"] }
zip                 = "2"
quick-xml           = { version = "0.37", features = ["serialize"] }
utoipa              = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
# Outbound SMTP (crate::mailer). rustls rather than native-tls: the rest of the
# core's TLS is rustls (axum-server, sqlx), and OpenSSL has no business being
# linked in for one feature. `pool` is off — the core sends a handful of
# transactional messages, not a campaign.
lettre              = { version = "0.11", default-features = false, features = [
    "tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname",
] }
# LDAP / Active Directory client (crate::directory). Pure Rust — the seccomp
# filter forbids `execve`, so shelling out to `ldapsearch` was never an option.
# `ldap3` is the only maintained pure-Rust LDAPv3 client with async I/O,
# STARTTLS and LDAPS; `default-features = false` drops its blocking wrapper and
# its native-tls default, and `tls-rustls-ring` puts it on the very rustls 0.23
# + ring provider the rest of the core already links (axum-server, sqlx,
# lettre). One TLS stack, one certificate story, no OpenSSL.
ldap3               = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# DNS, for proving that somebody controls the domain they just declared.
#
# 0.25 rather than 0.26: the latter demands rustc 1.88 and this workspace states
# 1.82 as its floor — a dependency must not silently raise what the product
# claims to build on. Default features are exactly what is needed (tokio, plus
# the system resolver configuration read from /etc/resolv.conf).
hickory-resolver    = "0.25"
# Reading a private certificate authority supplied by the operator: `rustls` on
# its own parses no PEM. Same crate `rustls` itself recommends, no extra stack.
rustls-pemfile      = "2"
# The system trust store, so adding a private authority ADDS to the public roots
# instead of replacing them. Already in the tree (ldap3 pulls it); named here
# because `crate::directory::client` builds its own root store.
rustls-native-certs = "0.8"
