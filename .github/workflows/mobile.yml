name: mobile

# The shared mobile libraries (mobile/, Gradle root): build and unit tests on every
# change under mobile/, and on a library release tag (mobile-v<version>, the version
# being kubunoMobileVersion in mobile/gradle.properties). Publishing to the Kubuno
# Maven registry is done from the private GitLab side (mobile/README.md); the module
# apps' public CI checks this repository out at that tag instead.
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: The tag matches the library version
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          want="${GITHUB_REF_NAME#mobile-v}"
          have="$(sed -n 's/^kubunoMobileVersion=//p' gradle.properties)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but kubunoMobileVersion=$have"; exit 1; }

      - name: Build and test the libraries
        run: ./gradlew build

      - name: Stage the Maven artifacts
        run: ./gradlew publishAllPublicationsToKubunoRepository -PkubunoMavenPublishUrl="file://$PWD/build/staging"

      - uses: actions/upload-artifact@v4
        with:
          name: kubuno-mobile-maven
          path: mobile/build/staging
