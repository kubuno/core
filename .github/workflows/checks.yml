name: Checks

# Security & quality gate (ISO/IEC 27001 A.8.29 secure testing, A.8.8 vuln mgmt).
# Complements build.yml (which only compiles): runs clippy -D warnings, the unit
# test suites, a dependency-vulnerability audit, and the frontend typecheck/tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      # clippy --all-targets also compiles the test code (catching test
      # build breakage).
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      # Compiling the tests is not running them: an assertion left behind by a
      # change of bound stayed red from v0.1.6 to v0.1.11 because nothing ever
      # executed it. The unit suites need no database; the integration suites
      # that need a Postgres service are still to be wired.
      - name: tests unitaires
        run: cargo test --lib

  # Conformance vectors (SC-0): the Rust and TypeScript runners and the core
  # repository's own suites, on the three desktop OSes (line endings, paths).
  vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: kubuno-vectors (clippy, tests)
        run: |
          cargo clippy -p kubuno-vectors --all-targets -- -D warnings
          cargo test -p kubuno-vectors
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: "@kubuno/vectors (node:test)"
        working-directory: frontend/packages/vectors
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: cargo audit
        run: cargo audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: install
        run: npm ci
      - name: typecheck (kbview-tsc -b, generates the .kbview/.kbcontrol types first)
        run: npm run typecheck
      - name: unit tests (vitest)
        run: npx vitest run --passWithNoTests
