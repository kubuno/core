[package]
name    = "kubuno-core"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "kubuno-core"
path = "src/main.rs"

[[bin]]
name = "kubuno"
path = "src/bin/kubuno/main.rs"

[lib]
name = "kubuno_core"
path = "src/lib.rs"

[dependencies]
tokio.workspace       = true
axum.workspace        = true
axum-server.workspace = true
rustls.workspace      = true
tower.workspace       = true
tower-http.workspace  = true
async-trait.workspace = true

sqlx.workspace        = true

serde.workspace       = true
serde_json.workspace  = true

jsonwebtoken.workspace = true
argon2.workspace       = true
aes-gcm.workspace      = true
rand.workspace         = true
sha2.workspace         = true
# Ed25519 verification for the signed catalogue manifest. `ring` is already in
# the tree (rustls, ACME): using it adds no new implementation to audit.
ring = "0.17"
hmac.workspace         = true
hkdf.workspace         = true
subtle.workspace       = true
base64.workspace       = true

reqwest.workspace   = true

config.workspace    = true
dotenvy.workspace   = true

validator.workspace = true
regex.workspace     = true

tracing.workspace            = true
tracing-subscriber.workspace = true
tracing-appender.workspace   = true

thiserror.workspace = true
anyhow.workspace    = true

uuid.workspace   = true
chrono.workspace = true
hickory-resolver.workspace = true
chrono-tz.workspace = true
ipnet.workspace  = true

bytes.workspace   = true
zip.workspace     = true
futures.workspace = true
tokio-util.workspace = true
yrs.workspace     = true
hex.workspace     = true
toml.workspace    = true
totp-rs.workspace = true
clap.workspace    = true
url.workspace               = true
lettre.workspace            = true
ldap3.workspace              = true
rustls-pemfile.workspace     = true
rustls-native-certs.workspace = true
x509-parser.workspace        = true
instant-acme.workspace       = true
tokio-tungstenite.workspace = true
kubuno-storage.workspace    = true
kubuno-mcp.workspace        = true
kubuno-modauth.workspace    = true
utoipa.workspace            = true

# POSIX only: `statvfs` and friends. Declared per platform because calling it
# unconditionally is what kept the server from compiling for Windows.
[target.'cfg(unix)'.dependencies]
libc.workspace   = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
