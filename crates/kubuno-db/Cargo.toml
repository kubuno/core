[package]
name        = "kubuno-db"
version     = "0.1.0"
edition     = "2021"
description = "Kubuno database foundation: one compile-time backend (PostgreSQL / MySQL-MariaDB / SQLite), placeholder rewriting and a dialect layer for what the three engines spell differently"
license     = "AGPL-3.0"
repository  = "https://github.com/kubuno/core"
readme      = "README.md"

# Explicit (non-workspace) dependency versions on purpose: this crate is pulled
# standalone by every module repo (its own workspace) via a git tag, so it must
# resolve identically no matter which workspace consumes it.
[dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate",
    # `derive`/`macros`: the FromRow derive modules use, and `sqlx::migrate!`,
    # which this crate re-exports through the `migrations!` macro.
    "derive", "macros",
] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "1"
tracing    = "0.1"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"

[features]
# Exactly one backend must be enabled. `default-features = false` is therefore
# mandatory in every consumer that does not want PostgreSQL.
default          = ["backend-postgres"]
backend-postgres = ["sqlx/postgres"]
backend-mysql    = ["sqlx/mysql"]
backend-sqlite   = ["sqlx/sqlite"]
